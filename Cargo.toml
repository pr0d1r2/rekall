# Self-specified, not workspace-inherited: `rekall` develops inside a larger
# workspace but is designed to leave it standalone (SPEC.md, V14), so it
# carries its own package metadata and its own lints from commit one.
[package]
# repo = crate = bin = theme, ONE word. §C records why there is no short
# form and which three names were rejected; the reasons are load-bearing and
# live there rather than being restated here.
name = "rekall"
# A minor is a level of GUARANTEE, not a feature count. 0.1.0 was the
# scaffold rung: the crate builds reproducibly on every supported platform
# and the gate runs, with no verb doing its job. That rung is passed, so the
# minor moves rather than the patch.
#
# 0.2.0 is the working rung: every verb but `catch` (T18) does its job end
# to end, and the loop closes on this crate's own corpus as consumer #0 --
# scan, plan, apply, check, hook, log, revert. `catch` still reports itself
# unimplemented, which is why this is 0.2.0 and not 1.0.
version = "0.2.0"
edition = "2024"
# The FLEET PIN, not a local choice: `nixpkgs-lock` pins nixos-26.05 for
# every repo in the fleet, and 1.95 is what it carries (SPEC.md R8). A crate
# that picks its own floor is a crate whose `nix build` reproduces only on
# its author's box. MEASURED here regardless -- the gate proves it rather
# than inheriting the claim.
rust-version = "1.95"
license = "MIT"
description = "mine agent memory and CLAUDE.md for rules and skills, extract them, and gate that the extraction stayed honest. CPU only, offline"
readme = "README.md"
repository = "https://github.com/pr0d1r2/rekall"
keywords = ["agents", "context", "skills", "memory", "spec"]
categories = ["command-line-utilities", "development-tools"]
# What NOT to ship: the dev environment and the gate machinery, which only
# mean anything inside the git repo. A `.crate` is source a consumer builds,
# not a clone of how it is developed.
#
# What DOES ship and is easy to mistake for machinery: `SPEC.md`,
# `.context-limits`, `.coverage`, `clippy.toml` and `rustfmt.toml`. Those are
# RECORDS -- the law, the ceilings, the floor, the lint decisions -- and a
# consumer reading the crate to judge it needs them more than the repo does.
# The fleet ships them for the same reason.
exclude = [
  ".envrc",
  ".github/",
  ".gitignore",
  "flake.nix",
  "flake.lock",
  "hk.pkl",
  "pkl/",
  # BOTH HALVES OF AN EXTRACTION, or neither. `.rekall/` holds the ledger and
  # the generated rule runners; `.claude/skills/` holds the generated skills.
  # They are one artifact set produced by one `apply`, and shipping the skills
  # while excluding the ledger that records them would put an artifact in the
  # tarball with nothing to say where it came from or how to reverse it -- the
  # orphan `check` refuses (V2).
  ".rekall/",
  ".claude/",
  # Gate TOOL configuration, as opposed to gate records. These configure
  # `typos` and `taplo`, which a consumer building from the tarball never
  # runs. `clippy.toml` and `rustfmt.toml` are deliberately NOT here: cargo
  # reads those when anyone builds or lints this source, tarball included.
  "_typos.toml",
  ".taplo.toml",
  # THIS REPO'S OWN corpus config, pointing at this repo's own `CLAUDE.md`.
  # Shipping it hands a consumer a config for a corpus they do not have, and
  # `init` exists to write them a correct one. A wrong config that looks
  # authoritative is worse than an absent one the cold start fills in.
  "rekall.toml",
  # The RECORD of what ships, and the CONFIG that publishes it. Both are about
  # the release rather than part of it, and `.crate-files` excluded means the
  # list never has to contain its own name.
  ".crate-files",
  "release.toml",
]

# lib + bin. The library is the contract a consumer and a test both use;
# the binary is a thin caller over it. It also gives `cargo test --doc`
# something to run, which a bin-only crate cannot (T32).
[lib]
name = "rekall"
path = "src/lib.rs"

[[bin]]
name = "rekall"
path = "src/main.rs"

# TOML is a real grammar with a specification, and hand-rolling a parser for
# it would be the reuse-before-building failure the fleet's own principles
# name -- for no gain, since neither crate reaches the network and both build
# in the offline sandbox from the tracked lock.
#
# Token counts stay DELEGATED to `itok` and are still not a cargo dependency:
# the gate reaches `itok check` as a pinned flake input (T2), and the
# in-crate use is T16, deliberately after the shape is proven.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# JSON output. V17 requires every verb to offer it with the same anatomy
# as its human form, so this is contract surface rather than convenience.
serde_json = "1"
# Globs and directory walking, both from the ripgrep ecosystem: specified
# behaviour, offline, and heavily exercised. `walkdir` is here for symlink
# loop detection specifically -- a hand-rolled recursion over a memory
# directory containing a self-referential link would hang rather than fail.
globset = "0.4"
walkdir = "2"

# The deny list runs with NO allow-list and NO lint-debt file, which is
# affordable exactly once: at zero lines of code. Adopting these after the
# code exists would mean measuring a debt and ratcheting it down instead
# (V12, V27).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"

[lints.rust]
unsafe_code = "forbid"
