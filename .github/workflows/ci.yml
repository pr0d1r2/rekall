# The gate, run exactly the way it runs locally: `nix develop` supplies the
# toolchain pinned in flake.lock, and `hk check` runs the ops defined in
# hk.pkl. ONE definition, one toolchain, no second install path, and no
# version skew between a runner and a laptop (SPEC.md V23).
#
# This file therefore installs no linters. hk, typos, taplo, nixfmt,
# ripsecrets and mth all arrive through the same pinned shell, which is the
# whole reason the step list lives in hk.pkl and not here. Copying the step
# list into this file would create the second rule set V23 forbids -- and the
# copy is the one that rots, because the local one is the one anybody runs.
#
# PLATFORM GAP, named rather than silently absent (SPEC.md §C, R12, V26):
# flake.nix declares FOUR supported systems and this matrix builds THREE.
# `x86_64-darwin` is supported and NOT exercised here, because GitHub offers
# no free x86_64 macOS runner. It is built locally instead. An untested
# platform claim is worse than an absent one only when nobody says it is
# untested -- so this says it.
#
# PENDING, listed for the same reason:
#   * release automation and publish

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token this workflow gets. READ, and only the contents -- nothing here
# writes to the repository, opens an issue or moves a ref, and a job handed
# more than it uses is a job an injected step can spend (zizmor:
# excessive-permissions).
permissions:
  contents: read

# One run per ref. A push landing while the previous run is still going
# leaves that run answering about code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate, on every platform CI can reach. Nothing installs a linter:
  # hk, typos, taplo, nixfmt, ripsecrets, mth, sherd and itok all arrive
  # through the same pinned shell.
  #
  # The job NAME is stated rather than inherited. GitHub falls back to the job
  # id when `name:` is absent, so the value here is deliberately that same id:
  # the status contexts stay byte-identical (`gate (ubuntu-latest)`), and no
  # branch protection -- here, or in a sibling that copies this file -- can be
  # stranded by a rename nobody saw in a diff. A default is a decision nobody
  # made (zizmor: anonymous-definition, reported only at `--persona=pedantic`).
  gate:
    name: gate
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, so one failure does not hide another that is
      # specific to the other OS.
      fail-fast: false
      # One runner per system this workflow can reach:
      #   ubuntu-latest    x86_64-linux
      #   ubuntu-24.04-arm aarch64-linux
      #   macos-latest     aarch64-darwin
      #   (x86_64-darwin   supported, no free runner -- see the note above)
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    # The coverage step compiles the suite with instrumentation, which is the
    # slowest thing here by some way. Generous, but bounded: a hung job that
    # burns an hour is worse than one that fails.
    #
    # The tight bound sits ON THE GATE STEP (25). A job bound also counts the
    # cache steps, and a job timeout cancels a job whose checks passed no
    # matter what `continue-on-error` says (itok#52). This one is only the
    # net above the gate plus the bounded cache steps.
    timeout-minutes: 35
    steps:
      # Pinned to commit SHAs, not tags. A tag is mutable: whoever controls
      # the action can move `v4` to different code, and every workflow that
      # trusts the tag runs it on the next push. The tag stays in the comment
      # because a SHA alone tells a reader nothing about which version they
      # are on, or whether it is behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is NOT left behind in `.git/config`. Nothing here
          # pushes, and a credential that outlives the step that needed it is
          # one a later step -- or a cached `target/` -- can carry off
          # (zizmor: artipacked).
          persist-credentials: false
          # Full history: gate steps read git, and a shallow clone makes them
          # answer about a repository shape that does not exist.
          fetch-depth: 0

      # The substituter is declared in flake.nix too, but `nixConfig` only
      # applies for a trusted user -- which a runner is not -- so a flake-only
      # declaration is a cache that silently never gets used. Stated here as
      # well, where it takes effect.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=

      # ONE cache: cargo's registry plus `target/`, keyed on the lockfiles.
      # There is NO Nix store cache. The shell is substituted from
      # cache.nixos.org and pr0d1r2.cachix.org (above), and restoring a cached
      # store is slower than that: on itok#54, macOS restored it in 215-280s
      # where substituting it took 29-45s, and dropping it halved total job
      # time. It also held this repo's Actions caches over the 10 GB budget
      # (10974 MiB in 18 entries), so every save evicted another.
      #
      # Restore and save are separate steps, each bounded and allowed to
      # fail: a slow cache is skipped, it never turns a passing gate red.
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      # The gate REALISES the dev shell -- hk, mth, itok, sherd, zizmor and the
      # toolchain -- and until now nothing published it. `nix-build` pushes the
      # PACKAGE, which is not what a contributor waits for: their first `nix
      # develop` builds the shell CI had already built and threw away. Pushing
      # from here is what makes `cachix use pr0d1r2` in CONTRIBUTING.md worth
      # the line it costs.
      #
      # It does NOT speed this job up much: `hk check` is dominated by
      # compiling this crate, which no binary cache can serve.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        # A CACHE PUSH MAY NOT DECIDE A BUILD. The upload runs in a POST step,
        # after the thing it is uploading has already succeeded or failed, so
        # its verdict is about the network and the cache service rather than
        # about this code. MEASURED on PR #4: the build passed, `rekall-0.4.0`
        # was pushed, and then the daemon drain timed out on one stuck path --
        # `cachix` exited 3, the job went red, and a release was blocked by a
        # cache being slow.
        #
        # The step still REPORTS: a failure is annotated on the run, so a cache
        # that has stopped accepting anything is visible rather than silent.
        continue-on-error: true
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # --check, because `hk check` defaults to running FIX commands; CI must
      # report, never rewrite. --all, because CI has no staged set.
      #
      # --no-fail-fast inverts the local default on purpose: locally the loop
      # is cheap so the FIRST failure is most useful, while here a round-trip
      # costs minutes, so whoever -- or whatever -- fixes this should get
      # every problem in one pass.
      - run: nix develop --command hk check --all --check --no-fail-fast
        timeout-minutes: 25

      # Saved only after a passing gate, only on a key miss, and bounded: a
      # slow upload is skipped and the job stays green.
      - if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}

  # The package, built from the tracked lock alone and PUSHED to the cache
  # that the gate job above reads from. Separate from the gate because it is
  # what fills the cache: a build that only ever happens inside a job which
  # also lints is a build nobody downstream can reuse.
  #
  # `nix build` runs on every platform for the same reason the gate does --
  # a package that builds on linux and not on darwin is a package that is
  # broken for half the people it is offered to.
  nix-build:
    # Stated for the reason given at `gate` above, and equal to the id for the
    # same reason.
    name: nix-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=

      # PUSHES what it builds. A fork's pull request has no secret, and the
      # action treats an empty token as read-only rather than failing -- so
      # the build still happens and only the push is skipped.
      #
      # What travels: this crate and its closure, all of it public source
      # from nixpkgs and the fleet's own flakes. Nothing here reads a private
      # file at eval time, which is the one thing that would put a secret in
      # a public cache.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        # A CACHE PUSH MAY NOT DECIDE A BUILD. The upload runs in a POST step,
        # after the thing it is uploading has already succeeded or failed, so
        # its verdict is about the network and the cache service rather than
        # about this code. MEASURED on PR #4: the build passed, `rekall-0.4.0`
        # was pushed, and then the daemon drain timed out on one stuck path --
        # `cachix` exited 3, the job went red, and a release was blocked by a
        # cache being slow.
        #
        # The step still REPORTS: a failure is annotated on the run, so a cache
        # that has stopped accepting anything is visible rather than silent.
        continue-on-error: true
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#default
