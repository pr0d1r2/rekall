# `pkl/` is VENDORED upstream, verbatim (SPEC.md V25). A typo in it is
# upstream's, and correcting it here would defeat the point of vendoring:
# the next sync would either revert the fix or conflict with it, and a
# vendored file that differs from its source is no longer a vendored file.
#
# Excluded rather than added to a word list, because the exclusion is about
# OWNERSHIP -- this repo does not own that text -- and not about whether
# `precendence` is a word.
[files]
extend-exclude = ["pkl/"]

# PROPER NOUNS the dictionary reads as misspellings. `typos` splits an
# identifier into words, so `HashiCorp` becomes `Hashi` + `Corp` and `Hashi`
# looks like a slip for `Hash`.
#
# This is not a preference. The `fix` half of the gate runs
# `typos --write-changes`, so an unlisted proper noun is not reported and
# left alone -- it is silently REWRITTEN, and a trademark notice that
# misspells the trademark is worse than no notice. MEASURED: it renamed
# HashiCorp to "HashCorp" inside the third-party notices and committed it.
[default.extend-words]
Hashi = "Hashi"
